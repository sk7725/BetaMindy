block.betamindy-gameyut.description =  \u041F\u0430\u043B\u043E\u0447\u043A\u0438 \u044E\u0442\u043D\u043E\u0440\u0438, \u0442\u0440\u0430\u0434\u0438\u0446\u0438\u043E\u043D\u043D\u0430\u044F \u043A\u043E\u0440\u0435\u0439\u0441\u043A\u0430\u044F \u043D\u0430\u0441\u0442\u043E\u043B\u044C\u043D\u0430\u044F \u0438\u0433\u0440\u0430.\n[accent]\u041F\u0440\u0430\u0432\u0438\u043B\u0430 \u0438\u0433\u0440\u044B:[]\n[white]\uE008 Do. \u041F\u0435\u0440\u0435\u043C\u0435\u0441\u0442\u0438\u0442\u044C\u0441\u044F \u043D\u0430 \u043E\u0434\u043D\u0443 \u043F\u043E\u0437\u0438\u0446\u0438\u044E \u0432\u043F\u0435\u0440\u0435\u0434.\n\uE009 Ge. \u041F\u0435\u0440\u0435\u043C\u0435\u0441\u0442\u0438\u0442\u0435\u0441\u044C \u043D\u0430 \u0434\u0432\u0435 \u043A\u043B\u0435\u0442\u043A\u0438 \u0432\u043F\u0435\u0440\u0435\u0434.\n\uE00A Geol. \u041F\u0435\u0440\u0435\u043C\u0435\u0441\u0442\u0438\u0442\u0435\u0441\u044C \u043D\u0430 \u0442\u0440\u0438 \u043F\u043E\u0437\u0438\u0446\u0438\u0438 \u0432\u043F\u0435\u0440\u0435\u0434.\n\uE00B Yut! \u041F\u0435\u0440\u0435\u043C\u0435\u0441\u0442\u0438\u0442\u0435\u0441\u044C \u043D\u0430 \u0447\u0435\u0442\u044B\u0440\u0435 \u043F\u043E\u0437\u0438\u0446\u0438\u0438 \u0432\u043F\u0435\u0440\u0435\u0434, [accent] \u0438 \u043F\u043E\u0432\u0442\u043E\u0440\u0438\u0442\u044C \u0431\u0440\u043E\u0441\u043E\u043A [].\n\uE007 Mo! \u041F\u0435\u0440\u0435\u043C\u0435\u0441\u0442\u0438\u0442\u0435\u0441\u044C \u043D\u0430 \u043F\u044F\u0442\u044C \u043F\u043E\u0437\u0438\u0446\u0438\u0438 \u0432\u043F\u0435\u0440\u0435\u0434, [accent] \u0438 \u043F\u043E\u0432\u0442\u043E\u0440\u0438\u0442\u044C \u0431\u0440\u043E\u0441\u043E\u043A [].\n\uE00C Back-do. \u041F\u0435\u0440\u0435\u043C\u0435\u0441\u0442\u0438\u0442\u044C\u0441\u044F \u043D\u0430 \u043E\u0434\u043D\u0443 \u043F\u043E\u0437\u0438\u0446\u0438\u044E \u043D\u0430\u0437\u0430\u0434. [accent]\u0415\u0441\u043B\u0438 \u0432\u044B \u043D\u0430\u0445\u043E\u0434\u0438\u0442\u0435\u0441\u044C \u043D\u0430 \u043F\u0435\u0440\u0432\u043E\u043C \u043F\u043E\u043B\u0435, \u0432\u0430\u0448\u0430 \u043F\u043E\u0437\u0438\u0446\u0438\u044F \u043E\u043F\u0443\u0441\u0442\u0435\u0435\u0442 \u0438 \u043F\u043E\u0439\u0434\u0435\u0442 \u043F\u0440\u044F\u043C\u043E \u043A \u0446\u0435\u043B\u0438![]\n\u0412\u0430\u043C \u0442\u0430\u043A\u0436\u0435 \u0441\u043B\u0435\u0434\u0443\u0435\u0442 \u0441\u0434\u0435\u043B\u0430\u0442\u044C \u0431\u0440\u043E\u0441\u043E\u043A \u0435\u0449\u0435 \u0440\u0430\u0437, \u043A\u043E\u0433\u0434\u0430 \u0432\u0430\u0448 \u0445\u043E\u0434 \u043F\u0440\u0438\u0437\u0435\u043C\u043B\u0438\u0442\u0441\u044F \u043D\u0430 \u0432\u0440\u0430\u0436\u0435\u0441\u043A\u043E\u043C \u043F\u043E\u043B\u0435, \u043E\u0442\u043F\u0440\u0430\u0432\u043B\u044F\u044F \u0432\u0440\u0430\u0433\u0430 \u0442\u043E\u0436\u0435 \u043D\u0430 \u043D\u0430\u0447\u0430\u043B\u043E.\n\u0421\u0442\u0435\u043A \u043F\u0435\u0440\u0435\u0431\u0440\u0430\u0441\u044B\u0432\u0430\u0435\u0442\u0441\u044F, \u0447\u0442\u043E \u043E\u0437\u043D\u0430\u0447\u0430\u0435\u0442, \u0447\u0442\u043E \u043C\u043E\u0436\u043D\u043E \u0432\u044B\u0438\u0433\u0440\u0430\u0442\u044C \u044D\u0442\u0443 \u0438\u0433\u0440\u0443 \u0432\u0441\u0435\u0433\u043E \u0437\u0430 \u043E\u0434\u0438\u043D \u0445\u043E\u0434, \u043D\u043E \u044D\u0442\u043E \u043A\u0440\u0430\u0439\u043D\u0435 \u043C\u0430\u043B\u043E\u0432\u0435\u0440\u043E\u044F\u0442\u043D\u043E.[]
